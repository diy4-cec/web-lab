<!doctype html>
<html>
<head>
<title>Student form</title>
</head>
<body>
<form>
<h1 align="center">STUDENT REGISTRATION FORM</h1>
<label>Name: </label>
<input type="text" placeholder="Enter full name" name="name">
<br><br>
<label>Age: </label>
<input type="number">
<br><br>
<label>Date of Birth: </label>
<input type="date" name="dob">
<br><br>
<label>Gender: </label>
<label><input type="radio" name="gender" value="female">Female</label>
<label><input type="radio" name="gender" value="male">Male</label>
<label><input type="radio" name="gender" value="others">Others</label>
<br><br>
<label>Phone: </label>
<input type="text" name="phone" placeholder="xxxxx-xxxxx">
<br><br>
<label>E-mail: </label>
<input type="email" name="email" placeholder="abc@gmail.com">
<br><br>
<label>Address: </label>
<textarea name="address" placeholder="eg: 123 street"></textarea>
<br><br>
<label>Qualifications: </label>
<br>
<label><input type="checkbox" name="qual" value="degree">Degree</label><br>
<label><input type="checkbox" name="qual" value="highers">Higher secondary</label><br>
<label><input type="checkbox" name="qual" value="sslc">SSLC</label>
<br><br>
<label>Course: </label>
<select>
<option value="">---select---</option>
<option value="btech">M.Tech</option>
<option value="mca">MCA</optio>
<option value="doc">Doctrate</option>
</select>
<br><br>
<label>Username: </label>
<input type="text" name="uname" placeholder="Enter your username">
<br><br>
<label>Password: </label>
<input type="password" name="pass" placeholder="Enter password">
<br><br>
<label>Document: </label>
<input type="file" name="file">
<br><br>
<label>Date of Transfer: </label>
<input type="date" name="dot">
<br><br>
</form>
<a href="login.html"><button type="submit">Submit</button></a>
<button type="reset">Clear</button>
</body>
</html>
