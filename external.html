<!doctype html>
<html>
<head>
<title>External CSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
 <h1>Basic Selectors</h1>
 <h2>Universal selector</h2>
 <p>Matches every single element on the page.</p>
 <h2>Type</h2>
 <h3>Targets all HTML elements matching that tag name.</h3>
 <h2>Class</h2>
 <p class="clas">Targets all elements with the specified class attribute.</p>
 <h2>Id</h2>
 <p id="ida">Targets a unique element with the matching id attribute.</p>
</body>
</html>
